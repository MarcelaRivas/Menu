<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurante PP — Menú digital (variante 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#view">Saltar al contenido</a>

<header class="topbar">
  <div class="topbar__in">
    <a class="brand" href="#/" aria-label="Restaurante PP, inicio">
      <span class="logo" aria-hidden="true">PP</span>
      <span class="brand__name">Restaurante PP</span>
    </a>
    <span class="topbar__tag">Menú digital</span>
  </div>
</header>

<nav class="crumbs" id="crumbs" aria-label="Migas de pan"></nav>
<main id="view" class="view" tabindex="-1"></main>

<!-- Anuncio emergente -->
<div class="modal" id="modal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-t">
    <p class="eyebrow">Anuncio</p>
    <h2 id="modal-t">Almuerzo ejecutivo</h2>
    <p>De lunes a viernes, de 12:00 m. a 3:00 p. m., disfrute nuestro menú del día con entrada, plato fuerte y bebida.</p>
    <button class="btn btn--primary" id="modal-close" type="button">Cerrar</button>
  </div>
</div>

<!-- Panel de configuración -->
<button class="gear" id="gear" type="button" aria-expanded="false" aria-controls="panel" aria-label="Configuración de la vista">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
<section class="panel" id="panel" hidden aria-label="Panel de configuración">
  <h2 class="panel__t">Configuración</h2>
  <div id="panel-body"></div>
  <div class="panel__jump">
    <p class="panel__l">Ir a pantalla</p>
    <div class="jump">
      <a href="#/">1 · Restaurante</a>
      <a href="#/sede/principal">2 · Sede</a>
      <a href="#/carta/1">3 · Categorías</a>
      <a href="#/categoria/3">4 · Productos</a>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
