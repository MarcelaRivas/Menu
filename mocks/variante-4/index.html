<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurante PP · Variante 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#/" aria-label="Restaurante PP, inicio">
      <span class="logo" aria-hidden="true">PP</span>
      <span class="brand-name">Restaurante PP</span>
    </a>
  </div>
</header>

<section class="hero" id="hero">
  <div class="hero-layer" id="layer0"></div>
  <div class="hero-layer" id="layer1"></div>
  <div class="hero-veil"></div>
  <div class="wrap hero-content" id="heroContent"></div>
</section>

<main id="main" class="wrap main" tabindex="-1"></main>

<!-- Anuncio emergente -->
<div class="modal" id="modal" hidden>
  <div class="modal-back" data-act="close-modal"></div>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-media"><span class="modal-badge">Anuncio</span></div>
    <div class="modal-body">
      <h2 id="modalTitle">Almuerzo de domingo en familia</h2>
      <p>Este domingo disfrute de nuestro menú especial de parrilla para toda la familia, con música en vivo desde la una de la tarde.</p>
      <button class="btn btn-primary" type="button" data-act="close-modal" id="modalClose">Entendido</button>
    </div>
    <button class="modal-x" type="button" data-act="close-modal" aria-label="Cerrar anuncio">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>
</div>

<!-- Panel de configuración -->
<button class="fab" type="button" id="fab" aria-expanded="false" aria-controls="cfg" aria-label="Abrir configuración del administrador">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M10.3 3h3.4l.5 2.4 1.9.8 2.1-1.3 2.4 2.4-1.3 2.1.8 1.9 2.4.5v3.4l-2.4.5-.8 1.9 1.3 2.1-2.4 2.4-2.1-1.3-1.9.8-.5 2.4h-3.4l-.5-2.4-1.9-.8-2.1 1.3-2.4-2.4 1.3-2.1-.8-1.9L3 13.7v-3.4l2.4-.5.8-1.9-1.3-2.1 2.4-2.4 2.1 1.3 1.9-.8z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
</button>
<aside class="cfg" id="cfg" hidden aria-label="Configuración simulada">
  <div class="cfg-head"><strong>Configuración</strong><button type="button" class="cfg-close" id="cfgClose" aria-label="Cerrar panel">&times;</button></div>
  <div class="cfg-body" id="cfgBody"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
