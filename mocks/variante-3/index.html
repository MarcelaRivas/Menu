<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurante PP — Variante 3 · Editorial de club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>

<header class="topbar">
  <div class="topbar__in">
    <a class="brand" href="#/" aria-label="Restaurante PP, inicio">
      <span class="logo" aria-hidden="true">PP</span>
      <span class="brand__name">Restaurante PP</span>
    </a>
    <span class="topbar__crumb" id="crumb"></span>
  </div>
</header>

<main id="main" class="stage" tabindex="-1"></main>

<footer class="foot">
  <span class="eyebrow">Restaurante PP</span>
  <span class="foot__note">Mock de la variante 3 · datos de ejemplo</span>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-t">
    <div class="modal__img" id="modal-img"></div>
    <div class="modal__body">
      <span class="eyebrow">Anuncio</span>
      <h2 id="modal-t">Noche de vinos y parrilla</h2>
      <p>Este viernes, a partir de las 7:00 p. m., acompañe nuestra carta de carnes con una selección de vinos de la casa. Reservas en recepción.</p>
      <button class="btn btn--primary" data-close type="button">Entendido</button>
    </div>
    <button class="modal__x" data-close type="button" aria-label="Cerrar anuncio">&times;</button>
  </div>
</div>

<button class="gear" id="gear" type="button" aria-label="Abrir configuración" aria-expanded="false" aria-controls="panel">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>
<aside class="panel" id="panel" hidden aria-label="Panel de configuración">
  <div class="panel__head"><span class="eyebrow">Configuración</span><button class="panel__close" type="button" id="panel-close" aria-label="Cerrar panel">&times;</button></div>
  <div class="panel__body" id="panel-body"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
